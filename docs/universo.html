<!DOCTYPE html>

<head>

<title>EL UNIVERSO — COSMOVERSE</title>
<style>
  :root {
    --ink: #eaf2f7;
    --muted: rgba(189, 207, 221, 0.62);
    --amber: #f5a623;
    --mint: #5fe3b3;
    --blue: #67a9d8;
    --bg: #02040a;
    --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  body {
    font-family: var(--sans);
    color: var(--ink);
    cursor: grab;
  }
  body.idle, body.idle #universo-canvas { cursor: none; }
  #universo-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  body {
    -webkit-tap-highlight-color: transparent;
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
      radial-gradient(circle at 50% 44%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.10) 44%, rgba(0, 0, 0, 0.48) 78%, rgba(0, 0, 0, 0.86) 100%),
      linear-gradient(180deg, rgba(2, 4, 10, 0.42) 0%, rgba(2, 4, 10, 0) 22%, rgba(2, 4, 10, 0) 74%, rgba(2, 4, 10, 0.52) 100%);
  }
  #overlay {
    position: fixed;
    top: max(clamp(18px, 4.4vh, 48px), calc(env(safe-area-inset-top, 0px) + 18px));
    left: max(clamp(18px, 4.4vw, 64px), calc(env(safe-area-inset-left, 0px) + 18px));
    z-index: 3;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #overlay.quiet h1 { opacity: 0; transform: translateY(-6px); }
  #overlay.quiet p { opacity: 0; }
  #overlay.quiet .brand { opacity: 0.42; }
  #overlay.hidden, #legend.hidden { opacity: 0; }
  .brand {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--amber);
    opacity: 0.92;
    margin-bottom: clamp(10px, 2vh, 18px);
    transition: opacity 1.2s ease;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5.3vw, 62px);
    font-weight: 300;
    line-height: 0.94;
    letter-spacing: 0.16em;
    color: var(--ink);
    text-shadow: 0 0 38px rgba(95, 227, 179, 0.16), 0 2px 24px rgba(0, 0, 0, 0.72);
    transition: opacity 1.4s ease, transform 1.4s ease;
    text-wrap: balance;
  }
  #overlay p {
    margin: clamp(12px, 2.2vh, 20px) 0 0 0;
    font-family: var(--mono);
    font-size: clamp(9px, 1.05vw, 12px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity 1.2s ease;
  }
  #legend {
    position: fixed;
    left: max(clamp(18px, 4.4vw, 64px), calc(env(safe-area-inset-left, 0px) + 18px));
    bottom: max(22px, env(safe-area-inset-bottom, 22px));
    z-index: 3;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    pointer-events: none;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(200, 216, 230, 0.58);
    transition: opacity 1.4s ease;
  }
  #legend.gone { opacity: 0; }
  #legend span { white-space: nowrap; }
  #pause, #tour {
    padding: 6px 10px;
    border: 1px solid rgba(200, 216, 230, 0.22);
    border-radius: 2px;
    background: rgba(2, 4, 10, 0.32);
    color: rgba(200, 216, 230, 0.62);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  #controls {
    position: fixed;
    top: max(18px, calc(env(safe-area-inset-top, 0px) + 18px));
    right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
    z-index: 3;
    display: flex;
    gap: 8px;
  }
  #pause:hover, #pause:focus-visible, #tour:hover, #tour:focus-visible {
    opacity: 1;
    color: var(--ink);
    border-color: rgba(245, 166, 35, 0.7);
  }
  #pause:focus-visible, #tour:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.35);
  }
  #tour[aria-pressed="true"] {
    opacity: 0.9;
    color: var(--amber);
    border-color: rgba(245, 166, 35, 0.48);
  }
  #tour-caption {
    position: fixed;
    left: 50%;
    bottom: max(92px, calc(env(safe-area-inset-bottom, 0px) + 92px));
    z-index: 3;
    width: min(88vw, 620px);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 8px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #tour-caption.on { opacity: 1; transform: translate(-50%, 0); }
  .tour-kicker {
    display: block;
    margin-bottom: 6px;
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(245, 166, 35, 0.78);
  }
  #tour-title {
    display: block;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--ink);
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
  }
    #tour-desc {
    display: block;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: rgba(200, 216, 230, 0.68);
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9);
  }
  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
    vertical-align: 1px;
  }
  .dot.dm { color: var(--blue); }
  .dot.gas { color: var(--mint); }
  .dot.gal { color: var(--amber); }
  #hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom, 22px));
    transform: translateX(-50%);
    z-index: 3;
    width: min(94vw, 860px);
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(200, 216, 230, 0.52);
    pointer-events: none;
    text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
    transition: opacity 1.4s ease;
    line-height: 1.5;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  #hint.gone { opacity: 0; }
  #lost {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--amber);
    background: rgba(2, 4, 10, 0.92);
  }
  #lost.on { display: flex; }
  @media (max-width: 700px) {
    h1 { letter-spacing: 0.12em; }
    #legend {
      display: none;
    }
    #hint {
      left: 0;
      transform: none;
      width: 100%;
      padding: 0 14px;
      font-size: 9px;
      letter-spacing: 0.02em;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
    }
    #controls {
      right: max(12px, calc(env(safe-area-inset-right, 0px) + 12px));
      gap: 6px;
    }
    #pause, #tour {
      padding: 5px 7px;
      font-size: 8px;
    }
    #tour-caption {
      bottom: max(96px, calc(env(safe-area-inset-bottom, 0px) + 96px));
      width: 92vw;
    }
    #tour-title { font-size: 15px; }
    #tour-desc { font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #overlay, h1, #legend, #hint { transition: none; }
  }
</style>

<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es
in vec3 aPositionLate;
in vec3 aColor;
in float aSize;
in float aAlpha;
in float aKind;

uniform mat4 uView;
uniform mat4 uProj;
uniform float uPixelRatio;
uniform float uShowDM;
uniform float uShowGas;
uniform float uShowGal;

out vec3 vColor;
out float vAlpha;
out float vKind;

void main() {
  vec4 viewPos = uView * vec4(aPositionLate, 1.0);
  gl_Position = uProj * viewPos;

  float invDepth = 1.0 / max(0.45, -viewPos.z);
  gl_PointSize = clamp(aSize * uPixelRatio * (2.3 * invDepth), 0.65, 56.0);

  float fog = 1.0 - smoothstep(2.0, 8.5, -viewPos.z);
  float visible = 1.0;
  if (aKind < 0.5) {
    visible = uShowDM;
  } else if (aKind < 1.5) {
    visible = uShowGas;
  } else {
    visible = uShowGal;
  }

  vColor = aColor;
  vAlpha = aAlpha * mix(0.16, 1.0, fog) * visible;
  vKind = aKind;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision mediump float;

in vec3 vColor;
in float vAlpha;
in float vKind;
out vec4 fragColor;

void main() {
  vec2 p = gl_PointCoord - vec2(0.5);
  float d = length(p);
  if (d > 0.5) discard;
  float halo = smoothstep(0.5, 0.0, d);
  float core = smoothstep(0.16, 0.0, d);
  vec3 col = vColor;
  if (vKind > 1.5) {
    col += core * vec3(0.35, 0.24, 0.12);
  }
  fragColor = vec4(col, vAlpha * halo);
}
</script>

<script id="quad-vertex-shader" type="x-shader/x-vertex">
#version 300 es
in vec2 aQuad;
out vec2 vUv;

void main() {
  vUv = aQuad * 0.5 + 0.5;
  gl_Position = vec4(aQuad, 0.0, 1.0);
}
</script>

<script id="bright-fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision mediump float;

uniform sampler2D uScene;
uniform float uThreshold;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec3 c = texture(uScene, vUv).rgb;
  float brightness = max(max(c.r, c.g), c.b);
  float factor = smoothstep(uThreshold, 1.0, brightness);
  fragColor = vec4(c * factor, 1.0);
}
</script>

<script id="blur-fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision mediump float;

uniform sampler2D uTexture;
uniform vec2 uTexel;
uniform vec2 uDirection;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec2 step = uTexel * uDirection;
  vec3 sum = texture(uTexture, vUv).rgb * 0.227027;
  sum += texture(uTexture, vUv + step * 1.384615).rgb * 0.316216;
  sum += texture(uTexture, vUv - step * 1.384615).rgb * 0.316216;
  sum += texture(uTexture, vUv + step * 3.230769).rgb * 0.070270;
  sum += texture(uTexture, vUv - step * 3.230769).rgb * 0.070270;
  fragColor = vec4(sum, 1.0);
}
</script>

<script id="volume-fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp sampler3D;

uniform sampler3D uVolume;
uniform vec3 uCameraPos;
uniform vec3 uForward;
uniform vec3 uRight;
uniform vec3 uUp;
uniform float uTanHalfFov;
uniform float uAspect;
uniform float uDensity;
uniform float uShowGas;
in vec2 vUv;
out vec4 fragColor;

const int STEPS = __STEPS__;

void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 dir = normalize(
    uForward
    + uRight * (ndc.x * uAspect * uTanHalfFov)
    + uUp * (ndc.y * uTanHalfFov)
  );
  vec3 origin = uCameraPos;
  vec3 invDir = 1.0 / dir;
  vec3 t0 = (-1.1 - origin) * invDir;
  vec3 t1 = ( 1.1 - origin) * invDir;
  vec3 tmin = min(t0, t1);
  vec3 tmax = max(t0, t1);
  float tNear = max(max(tmin.x, tmin.y), tmin.z);
  float tFar = min(min(tmax.x, tmax.y), tmax.z);
  tNear = max(tNear, 0.0);
  if (tFar <= tNear) discard;

  float stepSize = (tFar - tNear) / float(STEPS);
  vec3 gas = vec3(0.0);
  float visibleGas = uShowGas;

  for (int i = 0; i < STEPS; i++) {
    float t = tNear + (float(i) + 0.5) * stepSize;
    vec3 p = origin + dir * t;
    vec3 uvw = p * 0.5 + 0.5;
    vec2 fields = texture(uVolume, uvw).rg;
    float d = fields.r;
    float temp = fields.g;
    float edgeX = smoothstep(0.0, 0.10, uvw.x) * (1.0 - smoothstep(0.90, 1.0, uvw.x));
    float edgeY = smoothstep(0.0, 0.10, uvw.y) * (1.0 - smoothstep(0.90, 1.0, uvw.y));
    float edgeZ = smoothstep(0.0, 0.10, uvw.z) * (1.0 - smoothstep(0.90, 1.0, uvw.z));
    d *= edgeX * edgeY * edgeZ;
    d = smoothstep(0.42, 0.88, d);
    if (d > 0.002) {
      float hot = smoothstep(0.30, 0.88, temp);
      vec3 col = mix(
        vec3(0.004, 0.020, 0.050),
        vec3(0.08, 0.38, 0.40),
        clamp(d * 1.20, 0.0, 1.0)
      );
      col = mix(col, vec3(1.0, 0.58, 0.20), hot * d * 1.35);
      col += vec3(1.0, 0.90, 0.72) * pow(d, 4.0) * 0.30;
      float alpha = 1.0 - exp(-d * uDensity * stepSize);
      gas += col * alpha;
    }
  }
  fragColor = vec4(gas * visibleGas, 1.0);
}
</script>

<script id="composite-fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision mediump float;

uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uBloomStrength;
uniform float uExposure;
in vec2 vUv;
out vec4 fragColor;

void main() {
  vec3 scene = texture(uScene, vUv).rgb;
  vec3 bloom = texture(uBloom, vUv).rgb;
  vec3 c = scene + bloom * uBloomStrength;
  c = vec3(1.0) - exp(-c * uExposure);
  c = pow(c, vec3(1.0 / 2.2));
  fragColor = vec4(c, 1.0);
}
</script>

<script src="universo_camels.js"></script>

<script>
(function () {
  "use strict";

  var TARGET_POINTS = 250000;
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var isMobile = window.matchMedia("(max-width: 700px)").matches || (navigator.maxTouchPoints || 0) > 1;

  var Q = isMobile ? {
    nodes: 80,
    background: 4000,
    haloBase: 100,
    haloMass: 300,
    filamentBase: 120,
    filamentLength: 300,
    filamentRandom: 70,
    gasGlow: 1400,
    dmHaloFactor: 0.30,
    dmFilamentFactor: 0.20,
    bloomScale: 0.30,
    maxDpr: 1.5,
    volumeSteps: 28
  } : {
    nodes: 140,
    background: 9000,
    haloBase: 160,
    haloMass: 480,
    filamentBase: 190,
    filamentLength: 500,
    filamentRandom: 110,
    gasGlow: 3000,
    dmHaloFactor: 0.38,
    dmFilamentFactor: 0.28,
    bloomScale: 0.50,
    maxDpr: 2.0,
    volumeSteps: 52
  };

  var canvas = document.getElementById("universo-canvas");
  var lost = document.getElementById("lost");
  var overlay = document.getElementById("overlay");
  var legend = document.getElementById("legend");
  var hint = document.getElementById("hint");
  var hintGone = false;

  function fail(message) {
    lost.textContent = message;
    lost.classList.add("on");
  }

  var gl = canvas.getContext("webgl2", {
    alpha: false,
    antialias: true,
    depth: false,
    powerPreference: "high-performance"
  });
  if (!gl) {
    fail("Tu navegador no pudo iniciar WebGL2. Probá con Chrome, Edge o Firefox actualizado.");
    return;
  }

  function compile(type, source) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader) || "shader compile error");
    }
    return shader;
  }

  function link(vsSource, fsSource) {
    var vs = compile(gl.VERTEX_SHADER, vsSource);
    var fs = compile(gl.FRAGMENT_SHADER, fsSource);
    var program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "program link error");
    }
    return program;
  }

  function source(id) {
    return document.getElementById(id).textContent.trim();
  }

  var pointProgram;
  var brightProgram;
  var blurProgram;
  var compositeProgram;
  var volumeProgram;
  try {
    var quadVS = source("quad-vertex-shader");
    pointProgram = link(source("vertex-shader"), source("fragment-shader"));
    brightProgram = link(quadVS, source("bright-fragment-shader"));
    blurProgram = link(quadVS, source("blur-fragment-shader"));
    compositeProgram = link(quadVS, source("composite-fragment-shader"));
    volumeProgram = link(
      quadVS,
      source("volume-fragment-shader").replace("__STEPS__", String(Q.volumeSteps))
    );
  } catch (err) {
    fail("No se pudo compilar el renderizador WebGL2.");
    return;
  }

  var pointLoc = {
    late: gl.getAttribLocation(pointProgram, "aPositionLate"),
    color: gl.getAttribLocation(pointProgram, "aColor"),
    size: gl.getAttribLocation(pointProgram, "aSize"),
    alpha: gl.getAttribLocation(pointProgram, "aAlpha"),
    kind: gl.getAttribLocation(pointProgram, "aKind"),
    view: gl.getUniformLocation(pointProgram, "uView"),
    proj: gl.getUniformLocation(pointProgram, "uProj"),
    pixelRatio: gl.getUniformLocation(pointProgram, "uPixelRatio"),
    showDM: gl.getUniformLocation(pointProgram, "uShowDM"),
    showGas: gl.getUniformLocation(pointProgram, "uShowGas"),
    showGal: gl.getUniformLocation(pointProgram, "uShowGal")
  };

  var brightLoc = {
    quad: gl.getAttribLocation(brightProgram, "aQuad"),
    scene: gl.getUniformLocation(brightProgram, "uScene"),
    threshold: gl.getUniformLocation(brightProgram, "uThreshold")
  };
  var blurLoc = {
    quad: gl.getAttribLocation(blurProgram, "aQuad"),
    texture: gl.getUniformLocation(blurProgram, "uTexture"),
    texel: gl.getUniformLocation(blurProgram, "uTexel"),
    direction: gl.getUniformLocation(blurProgram, "uDirection")
  };
  var compositeLoc = {
    quad: gl.getAttribLocation(compositeProgram, "aQuad"),
    scene: gl.getUniformLocation(compositeProgram, "uScene"),
    bloom: gl.getUniformLocation(compositeProgram, "uBloom"),
    strength: gl.getUniformLocation(compositeProgram, "uBloomStrength"),
    exposure: gl.getUniformLocation(compositeProgram, "uExposure")
  };
  var volumeLoc = {
    quad: gl.getAttribLocation(volumeProgram, "aQuad"),
    volume: gl.getUniformLocation(volumeProgram, "uVolume"),
    cameraPos: gl.getUniformLocation(volumeProgram, "uCameraPos"),
    forward: gl.getUniformLocation(volumeProgram, "uForward"),
    right: gl.getUniformLocation(volumeProgram, "uRight"),
    up: gl.getUniformLocation(volumeProgram, "uUp"),
    tanHalfFov: gl.getUniformLocation(volumeProgram, "uTanHalfFov"),
    aspect: gl.getUniformLocation(volumeProgram, "uAspect"),
    density: gl.getUniformLocation(volumeProgram, "uDensity"),
    showGas: gl.getUniformLocation(volumeProgram, "uShowGas")
  };

  gl.disable(gl.DEPTH_TEST);

  // ---------------------------------------------------------------------------
  // Deterministic N-body density field -> layered cosmic web.
  // ---------------------------------------------------------------------------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(20261102);

    var f = scaled - index;

      a[0] + (b[0] - a[0]) * f,

  function buildCdf(power, floor) {
    var cdf = new Float64Array(VOL * VOL * VOL);

      var weight = Math.pow(d, power) + floor;
      total += weight;

    var target = rand() * total;

      if (cdf[mid] < target) {

  var layerDefs = [
    { count: 110000, power: 0.80, floor: 0.020, kind: 0 },

    for (var pi = 0; pi < def.count; pi++) {
      var voxel = sampleVoxel(distribution.cdf, distribution.total);

    var separated = true;
    for (var pn = 0; pn < peaks.length; pn++) {
      var pdx = candidatePoint[0] - peaks[pn].x;
      var pdy = candidatePoint[1] - peaks[pn].y;
      var pdz = candidatePoint[2] - peaks[pn].z;
      if (pdx * pdx + pdy * pdy + pdz * pdz < 0.30 * 0.30) {
        separated = false;

    }
    if (separated) {
      peaks.push({
        x: candidatePoint[0],
        y: candidatePoint[1],
        z: candidatePoint[2],

    for (var vn = 0; vn < nodes.length; vn++) {

      var vdy = voidPoint[1] - nodes[vn].y;

  function buildTourStops() {

  var sceneTarget = null;

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);

      gl.deleteTexture(tex);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      canvas.height = height;

    deleteTarget(bloomA);
    deleteTarget(bloomB);
    sceneTarget = createTarget(width, height);

    var bloomH = Math.max(1, Math.floor(height * Q.bloomScale));
    bloomA = createTarget(bloomW, bloomH);
    bloomB = createTarget(bloomW, bloomH);

  function perspective(out, fovy, aspect, near, far) {
    var f = 1.0 / Math.tan(fovy / 2);
    var nf = 1.0 / (near - far);
    out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
    out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
    out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
    out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
  }

  function lookAt(out, eye, center, up) {
    var zx = eye[0] - center[0];
    var zy = eye[1] - center[1];
    var zz = eye[2] - center[2];
    var zl = 1 / Math.sqrt(zx * zx + zy * zy + zz * zz);
    zx *= zl; zy *= zl; zz *= zl;
    var xx = up[1] * zz - up[2] * zy;
    var xy = up[2] * zx - up[0] * zz;
    var xz = up[0] * zy - up[1] * zx;
    var xl = 1 / Math.sqrt(xx * xx + xy * xy + xz * xz);
    xx *= xl; xy *= xl; xz *= xl;
    var yx = zy * xz - zz * xy;
    var yy = zz * xx - zx * xz;
    var yz = zx * xy - zy * xx;
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    out[15] = 1;
  }

  function projectPoint(x, y, z) {
    var vx = view[0] * x + view[4] * y + view[8] * z + view[12];
    var vy = view[1] * x + view[5] * y + view[9] * z + view[13];
    var vz = view[2] * x + view[6] * y + view[10] * z + view[14];
    var cw = proj[3] * vx + proj[7] * vy + proj[11] * vz + proj[15];
    if (cw <= 0.001) return null;
    var nx = (proj[0] * vx + proj[4] * vy + proj[8] * vz + proj[12]) / cw;
    var ny = (proj[1] * vx + proj[5] * vy + proj[9] * vz + proj[13]) / cw;
    var nz = (proj[2] * vx + proj[6] * vy + proj[10] * vz + proj[14]) / cw;
    if (nz < -1 || nz > 1) return null;
    return {
      x: (nx * 0.5 + 0.5) * window.innerWidth,
      y: (1 - (ny * 0.5 + 0.5)) * window.innerHeight,
      z: nz
    };
  }

        cam.tRadius = next.radius;
        cam.tTheta = next.theta;
        cam.tPhi = next.phi;
        showTourCaption(next);
      }
    } else if (tour.clock >= 3.8) {
      tour.phase = "hold";
      tour.clock = 0;
    }
  }

  function flashLegend() {
    legend.classList.remove("gone");
    window.clearTimeout(legendTimer);
    legendTimer = window.setTimeout(function () {
      legend.classList.add("gone");
    }, 4200);
  }

  function fadeHint() {
    hint.classList.add("gone");
    hintGone = true;
  }

  function focusNode(node) {
    stopTour();
    cam.tTarget = [node.x, node.y, node.z];
    cam.tRadius = 2.15;
    cam.focusUntil = performance.now() + 12000;
    auto = !paused;
    fadeHint();
  }

  function pickAndFocus(clientX, clientY) {
    var best = null;
    var bestDistance = 70 * 70;
    for (var i = 0; i < nodes.length; i++) {
      var p = projectPoint(nodes[i].x, nodes[i].y, nodes[i].z);
      if (!p) continue;
      var dx = p.x - clientX;
      var dy = p.y - clientY;
      var dist = dx * dx + dy * dy;
      if (dist < bestDistance) {
        bestDistance = dist;
        best = nodes[i];
      }
    }
    if (best) {
      focusNode(best);
    } else {
      resetCamera();
    }
  }

  function updateCamera(dt, now) {
    if (cam.focusUntil && now > cam.focusUntil) {
      cam.focusUntil = 0;
      cam.tTarget = [0, 0, 0];
      cam.tRadius = cam.baseRadius;
    }
    if (auto) {
      cam.tTheta += dt * 0.045;
      if (!cam.focusUntil) {
        cam.tPhi = 0.16 + Math.sin(now * 0.00006) * 0.05;
        cam.tRadius = cam.baseRadius + Math.sin(now * 0.00008) * 0.20;
      }
    }
    var ease = Math.min(1, dt * 4.2);
    cam.theta += (cam.tTheta - cam.theta) * ease;
    cam.phi += (cam.tPhi - cam.phi) * ease;
    cam.radius += (cam.tRadius - cam.radius) * ease;
    for (var i = 0; i < 3; i++) {
      cam.target[i] += (cam.tTarget[i] - cam.target[i]) * ease;
    }

    var cosPhi = Math.cos(cam.phi);
    var eye = [
      cam.target[0] + cam.radius * cosPhi * Math.sin(cam.theta),
      cam.target[1] + cam.radius * Math.sin(cam.phi),
      cam.target[2] + cam.radius * cosPhi * Math.cos(cam.theta)
    ];
    lookAt(view, eye, cam.target, [0, 1, 0]);
    perspective(proj, (42 * Math.PI) / 180, canvas.width / Math.max(1, canvas.height), 0.1, 100);
    cameraEye = eye;
    cameraTarget = [cam.target[0], cam.target[1], cam.target[2]];
  }

  // ---------------------------------------------------------------------------
  // Interaction.
  // ---------------------------------------------------------------------------
  window.setTimeout(function () { overlay.classList.add("quiet"); }, 9000);
  window.setTimeout(fadeHint, 12000);
  window.setTimeout(function () { legend.classList.add("gone"); }, 16000);

  var idleTimer = window.setTimeout(function () {
    document.body.classList.add("idle");
  }, 4200);

  function wake() {
    document.body.classList.remove("idle");
    window.clearTimeout(idleTimer);
    idleTimer = window.setTimeout(function () {
      document.body.classList.add("idle");
    }, 4200);
  }
  window.addEventListener("pointermove", wake);
  window.addEventListener("pointerdown", wake);

  canvas.addEventListener("pointerdown", function (event) {
    stopTour();
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(event.pointerId); } catch (err) { /* ignore */ }
    }
    fadeHint();
    if (pointers.size === 1) {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      auto = false;
      window.clearTimeout(resumeTimer);
      canvas.style.cursor = "grabbing";
    } else if (pointers.size === 2) {
      dragging = false;
      var pts = Array.from(pointers.values());
      var dx = pts[0].x - pts[1].x;
      var dy = pts[0].y - pts[1].y;
      pinchStartDistance = Math.sqrt(dx * dx + dy * dy);
      pinchStartRadius = cam.tRadius;
      auto = false;
    }
  });

  canvas.addEventListener("pointermove", function (event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size >= 2) {
      var pts = Array.from(pointers.values());
      var dx = pts[0].x - pts[1].x;
      var dy = pts[0].y - pts[1].y;
      var distance = Math.sqrt(dx * dx + dy * dy);
      if (pinchStartDistance > 0 && distance > 0) {
        cam.tRadius = clamp(pinchStartRadius * (pinchStartDistance / distance), 1.5, 9.0);
      }
      return;
    }
    if (!dragging) return;
    var mx = event.clientX - lastX;
    var my = event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    cam.tTheta -= mx * 0.006;
    cam.tPhi = clamp(cam.tPhi - my * 0.005, -1.16, 1.16);
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    if (event && canvas.releasePointerCapture) {
      try { canvas.releasePointerCapture(event.pointerId); } catch (err) { /* ignore */ }
    }
    if (pointers.size === 0) {
      dragging = false;
      canvas.style.cursor = "grab";
      scheduleResume();
    } else if (pointers.size === 1) {
      dragging = false;
      var remaining = Array.from(pointers.values())[0];
      lastX = remaining.x;
      lastY = remaining.y;
      pinchStartDistance = 0;
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  canvas.addEventListener("wheel", function (event) {
    event.preventDefault();
    stopTour();
    cam.tRadius = clamp(cam.tRadius * Math.exp(event.deltaY * 0.0012), 1.5, 9.0);
    auto = false;
    scheduleResume();
    fadeHint();
  }, { passive: false });

  canvas.addEventListener("dblclick", function (event) {
    stopTour();
    pickAndFocus(event.clientX, event.clientY);
  });

  window.addEventListener("keydown", function (event) {
    if (event.target === pauseButton || event.target === tourButton) return;
    var key = event.key;
    if (key === "r" || key === "R") {
      resetCamera();
      fadeHint();
    } else if (key === "f" || key === "F") {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () { /* ignore */ });
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(function () { /* ignore */ });
      }
    } else if (key === "h" || key === "H") {
      var hidden = overlay.classList.contains("hidden");
      if (hidden) {
        overlay.classList.remove("hidden");
        overlay.classList.remove("quiet");
        legend.classList.remove("hidden");
        legend.classList.remove("gone");
        if (hintGone) hint.classList.remove("gone");
        if (tour.active) showTourCaption(tourStops[tour.index]);
      } else {
        overlay.classList.add("hidden");
        legend.classList.add("hidden");
        hint.classList.add("gone");
        hideTourCaption();
        hintGone = true;
      }
    } else if (key === "g" || key === "G") {
      toggleTour();
    } else if (key === "1") {
      layers.dm = !layers.dm;
      flashLegend();
    } else if (key === "2") {
      layers.gas = !layers.gas;
      flashLegend();
    } else if (key === "3") {
      layers.gal = !layers.gal;
      flashLegend();
    } else if (key === "ArrowLeft") {
      event.preventDefault();
      cam.tTheta -= 0.08;
      auto = false;
    } else if (key === "ArrowRight") {
      event.preventDefault();
      cam.tTheta += 0.08;
      auto = false;
    } else if (key === "ArrowUp") {
      event.preventDefault();
      cam.tPhi = clamp(cam.tPhi + 0.06, -1.16, 1.16);
      auto = false;
    } else if (key === "ArrowDown") {
      event.preventDefault();
      cam.tPhi = clamp(cam.tPhi - 0.06, -1.16, 1.16);
      auto = false;
    } else if (key === "+" || key === "=") {
      event.preventDefault();
      cam.tRadius = clamp(cam.tRadius * 0.9, 1.5, 9.0);
      auto = false;
    } else if (key === "-" || key === "_") {
      event.preventDefault();
      cam.tRadius = clamp(cam.tRadius * 1.1, 1.5, 9.0);
      auto = false;
    } else if (event.code === "Space") {
      event.preventDefault();
      togglePause();
    }
  });

  window.addEventListener("resize", function () {
    resizeTargets();
    lastFrame = performance.now();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      window.cancelAnimationFrame(raf);
    } else {
      lastFrame = performance.now();
      raf = window.requestAnimationFrame(frame);
    }
  });

  canvas.addEventListener("webglcontextlost", function (event) {
    event.preventDefault();
    window.cancelAnimationFrame(raf);
    fail("Se perdió el contexto WebGL. Recargá la página para volver al universo.");
  });
  canvas.addEventListener("webglcontextrestored", function () {
    window.location.reload();
  });

  // ---------------------------------------------------------------------------
  // Render passes.
  // ---------------------------------------------------------------------------
  function drawPoints(target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
    gl.clearColor(0.003, 0.006, 0.014, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(pointProgram);
    gl.uniformMatrix4fv(pointLoc.view, false, view);
    gl.uniformMatrix4fv(pointLoc.proj, false, proj);
    gl.uniform1f(pointLoc.pixelRatio, dpr);
    gl.uniform1f(pointLoc.showDM, layers.dm ? 1.0 : 0.0);
    gl.uniform1f(pointLoc.showGas, layers.gas ? 1.0 : 0.0);
    gl.uniform1f(pointLoc.showGal, layers.gal ? 1.0 : 0.0);
    bindPointAttributes();
    gl.drawArrays(gl.POINTS, 0, pointCount);
  }

  function drawBright() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fb);
    gl.viewport(0, 0, bloomA.w, bloomA.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.BLEND);
    gl.useProgram(brightProgram);
    bindQuadAttributes(brightLoc.quad);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTarget.tex);
    gl.uniform1i(brightLoc.scene, 0);
    gl.uniform1f(brightLoc.threshold, 0.38);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function blurPass(source, target, dx, dy) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
    gl.viewport(0, 0, target.w, target.h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.BLEND);
    gl.useProgram(blurProgram);
    bindQuadAttributes(blurLoc.quad);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, source.tex);
    gl.uniform1i(blurLoc.texture, 0);
    gl.uniform2f(blurLoc.texel, 1.0 / source.w, 1.0 / source.h);
    gl.uniform2f(blurLoc.direction, dx, dy);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function drawVolume(target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
    gl.viewport(0, 0, target.w, target.h);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(volumeProgram);
    bindQuadAttributes(volumeLoc.quad);

    var fx = cameraTarget[0] - cameraEye[0];
    var fy = cameraTarget[1] - cameraEye[1];
    var fz = cameraTarget[2] - cameraEye[2];
    var fl = 1 / Math.sqrt(fx * fx + fy * fy + fz * fz);
    fx *= fl; fy *= fl; fz *= fl;
    var rx = fy * 0 - fz * 1;
    var ry = fz * 0 - fx * 0;
    var rz = fx * 1 - fy * 0;
    var rl = 1 / Math.sqrt(rx * rx + ry * ry + rz * rz);
    rx *= rl; ry *= rl; rz *= rl;
    var ux = ry * fz - rz * fy;
    var uy = rz * fx - rx * fz;
    var uz = rx * fy - ry * fx;

    gl.uniform3f(volumeLoc.cameraPos, cameraEye[0], cameraEye[1], cameraEye[2]);
    gl.uniform3f(volumeLoc.forward, fx, fy, fz);
    gl.uniform3f(volumeLoc.right, rx, ry, rz);
    gl.uniform3f(volumeLoc.up, ux, uy, uz);
    gl.uniform1f(volumeLoc.tanHalfFov, Math.tan((42 * Math.PI) / 360));
    gl.uniform1f(volumeLoc.aspect, canvas.width / Math.max(1, canvas.height));
    gl.uniform1f(volumeLoc.density, 2.2);
    gl.uniform1f(volumeLoc.showGas, layers.gas ? 1.0 : 0.0);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_3D, volumeTexture);
    gl.uniform1i(volumeLoc.volume, 2);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function drawComposite(bloomTexture, strength) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.BLEND);
    gl.useProgram(compositeProgram);
    bindQuadAttributes(compositeLoc.quad);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTarget.tex);
    gl.uniform1i(compositeLoc.scene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bloomTexture);
    gl.uniform1i(compositeLoc.bloom, 1);
    gl.uniform1f(compositeLoc.strength, strength);
    gl.uniform1f(compositeLoc.exposure, 1.18);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function render() {
    if (!sceneTarget) {
      drawPoints(null);
      return;
    }
    drawPoints(sceneTarget);
    if (volumeEnabled && layers.gas) {
      drawVolume(sceneTarget);
    }
    if (bloomEnabled) {
      drawBright();
      blurPass(bloomA, bloomB, 1, 0);
      blurPass(bloomB, bloomA, 0, 1);
      drawComposite(bloomA.tex, 1.05);
    } else {
      drawComposite(blackTexture, 0.0);
    }
  }

  function frame(now) {
    var dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
    lastFrame = now;
    if (qualityStage < 2) {
      qualityFrames += 1;
      qualityTime += dt;
      if (qualityFrames >= 90) {
        if (qualityTime / qualityFrames > 0.028) {
          if (qualityStage === 0) {
            volumeEnabled = false;
          } else {
            bloomEnabled = false;
          }
          qualityStage += 1;
        } else {
          qualityStage = 2;
        }
        qualityFrames = 0;
        qualityTime = 0;
      }
    }
    updateTour(dt);
    updateCamera(dt, now);
    render();
    raf = window.requestAnimationFrame(frame);
  }

  resizeTargets();
  lastFrame = performance.now();
  if (!reducedMotion) {
    startTour();
  } else {
    setTourButton();
  }
  raf = window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
