[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmoverse"
version = "1.2.0"
description = "Cosmological Modeling and Inference Engine - An Open Framework for Computational Cosmology"
readme = "README.md"
authors = [
    { name = "clevervi", email = "adriandariov@gmail.com" }
]
maintainers = [
    { name = "clevervi", email = "adriandariov@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "cosmology",
    "astrophysics",
    "differentiable-simulation",
    "bayesian-inference",
    "neural-emulators",
    "sbi",
    "jax",
    "n-body"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
]
torch = [
    "torch>=2.1.0",
]
inference = [
    "sbi>=0.22.0",
    "corner>=2.2.2",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
all = [
    "cosmoverse[jax,torch,inference,dev]"
]

[project.scripts]
cosmoverse = "cosmoverse.cli:main"

[project.urls]
Homepage = "https://github.com/clevervi/cosmoverse"
Repository = "https://github.com/clevervi/cosmoverse"
Documentation = "https://github.com/clevervi/cosmoverse/tree/main/docs"
"Bug Tracker" = "https://github.com/clevervi/cosmoverse/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cosmoverse*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]
