name: CI

# Hosted CI is manual by default to preserve Actions quota.
# The required gate is local: scripts/ci.ps1 (Windows) or scripts/ci.sh (Unix).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate repository structure and YAML/JSON
        run: uv run python scripts/check_repo.py

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run pytest test suite
        run: uv run pytest -v

      - name: Run Paper 1 MVP protocol verification
        run: uv run python experiments/run_paper1_mvp_protocol.py
